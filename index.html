<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MindStrike · Insane Reload</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #050308;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        /* ===== CONTAINERS ===== */
        #reload-stage {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050308;
            overflow: hidden;
        }
        #reload-stage.gone {
            display: none;
        }

        #app {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: radial-gradient(ellipse at 50% 40%, #1a1420 0%, #050308 80%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        #app.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* ===== WARP TUNNEL ===== */
        .warp-tunnel {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 800px;
            pointer-events: none;
        }
        .warp-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(212, 160, 64, 0.5);
            box-shadow: 0 0 40px rgba(212, 160, 64, 0.3), inset 0 0 40px rgba(212, 160, 64, 0.1);
            animation: warpZoom 2.4s cubic-bezier(0.6, 0, 0.4, 1) forwards;
            opacity: 0;
        }
        @keyframes warpZoom {
            0% { transform: scale(0.1) rotate(0deg); opacity: 0; border-color: #f0d080; }
            20% { opacity: 1; }
            100% { transform: scale(8) rotate(720deg); opacity: 0; border-color: #c9a227; }
        }

        /* ===== SHOCKWAVE ===== */
        .shockwave {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 3px solid #f0d080;
            box-shadow: 0 0 60px rgba(240, 208, 128, 0.8), inset 0 0 40px rgba(240, 208, 128, 0.4);
            animation: shockExpand 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
            opacity: 0;
            pointer-events: none;
        }
        @keyframes shockExpand {
            0% { transform: scale(0.2); opacity: 1; border-width: 8px; }
            100% { transform: scale(12); opacity: 0; border-width: 1px; }
        }

        /* ===== PARTICLE BURST ===== */
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFly var(--dur, 1.4s) cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
            opacity: 0;
            filter: drop-shadow(0 0 6px var(--color));
        }
        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* ===== SPARK STREAKS ===== */
        .streak {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px 3px var(--color, #f0d080);
            pointer-events: none;
            animation: streakFly var(--dur, 0.8s) ease-out forwards;
            opacity: 0;
        }
        @keyframes streakFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
        }

        /* ===== GLITCH OVERLAY ===== */
        .glitch-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0;
            animation: glitchFlash 0.6s steps(2) forwards;
        }
        @keyframes glitchFlash {
            0% { opacity: 0; }
            10% { opacity: 0.9; background: #f0d080; transform: translateX(0); }
            20% { opacity: 0.3; background: #c060ff; transform: translateX(-8px); }
            30% { opacity: 0.8; background: #4fd0ff; transform: translateX(8px); }
            40% { opacity: 0.2; background: #f0d080; transform: translateX(-4px); }
            50% { opacity: 0.6; background: #c060ff; transform: translateX(4px); }
            60% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* ===== CENTRAL ICON / LOGO ===== */
        .core-icon {
            position: relative;
            z-index: 20;
            width: clamp(100px, 22vw, 180px);
            height: clamp(100px, 22vw, 180px);
            animation: corePop 1.8s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.3) rotate(-180deg);
        }
        @keyframes corePop {
            0% { opacity: 0; transform: scale(0.3) rotate(-180deg); filter: blur(10px); }
            50% { opacity: 1; transform: scale(1.1) rotate(0deg); filter: blur(0); }
            70% { transform: scale(0.95) rotate(0deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .core-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 50px rgba(212, 160, 64, 0.8));
        }

        /* pulsing halo behind icon */
        .core-halo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 160, 64, 0.3) 0%, transparent 60%);
            animation: haloPulse 1.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 15;
        }
        @keyframes haloPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
        }

        /* ===== TITLE TEXT ===== */
        .reload-title {
            position: absolute;
            top: 62%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            text-align: center;
            white-space: nowrap;
            opacity: 0;
            animation: titleSlam 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) 0.6s forwards;
        }
        @keyframes titleSlam {
            0% { opacity: 0; transform: translateX(-50%) scale(2.5); filter: blur(12px); }
            60% { opacity: 1; transform: translateX(-50%) scale(0.95); filter: blur(0); }
            80% { transform: translateX(-50%) scale(1.02); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        .reload-title h1 {
            font-size: clamp(1.6rem, 6vw, 3.2rem);
            font-weight: 900;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #f0d080 30%, #d4a040 50%, #c9a227 70%, #f0d080 100%);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleShimmer 2s linear infinite;
            text-shadow: 0 0 60px rgba(212, 160, 64, 0.5);
        }
        @keyframes titleShimmer {
            0% { background-position: 300% 0; }
            100% { background-position: -300% 0; }
        }

        .reload-title .sub {
            font-size: clamp(0.55rem, 1.5vw, 0.8rem);
            letter-spacing: 0.6em;
            color: #a08e7a;
            text-transform: uppercase;
            margin-top: 0.4rem;
            opacity: 0;
            animation: fadeIn 0.8s ease 1.2s forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== SCANLINE / VIGNETTE ===== */
        .scanlines {
            position: absolute;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.12) 0px,
                rgba(0, 0, 0, 0.12) 1px,
                transparent 1px,
                transparent 3px
            );
            opacity: 0.4;
        }
        .vignette {
            position: absolute;
            inset: 0;
            z-index: 29;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.9) 100%);
        }

        /* ===== FLASH ===== */
        .big-flash {
            position: absolute;
            inset: 0;
            z-index: 100;
            background: #fff;
            opacity: 0;
            pointer-events: none;
        }
        .big-flash.pop {
            animation: flashKill 0.5s ease-out forwards;
        }
        @keyframes flashKill {
            0% { opacity: 0; }
            15% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ===== APP CARD ===== */
        .app-card {
            background: rgba(20, 16, 24, 0.9);
            border: 1px solid #4a3a2a;
            border-radius: 2rem;
            padding: 3rem 3.5rem;
            text-align: center;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.9), 0 0 0 1px #2a1e14 inset, 0 0 60px rgba(212, 160, 64, 0.08);
            backdrop-filter: blur(12px);
            animation: cardIn 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: scale(0.85) translateY(20px); filter: blur(6px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        .app-card h2 {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 300;
            letter-spacing: 0.12em;
            color: #d4b48c;
            margin-bottom: 0.5rem;
        }
        .app-card .sub {
            color: #a08e7a;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .reload-btn {
            padding: 0.9rem 2.2rem;
            border-radius: 2rem;
            border: 1px solid #5a4430;
            background: linear-gradient(145deg, #2a202a, #1a1210);
            color: #d4b48c;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            position: relative;
            overflow: hidden;
        }
        .reload-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(240, 208, 128, 0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        .reload-btn:hover::before {
            transform: translateX(100%);
        }
        .reload-btn:hover {
            background: linear-gradient(145deg, #3d2e20, #2a1e14);
            border-color: #d4a040;
            color: #f0d080;
            box-shadow: 0 0 30px rgba(212, 160, 64, 0.4);
            transform: translateY(-2px);
        }
        .reload-btn:active {
            transform: translateY(0) scale(0.97);
        }

        /* ===== REDUCED MOTION ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .warp-ring, .shockwave, .particle, .streak, .glitch-layer, .scanlines {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- ========== INSANE RELOAD STAGE ========== -->
    <div id="reload-stage">
        <div class="scanlines"></div>
        <div class="vignette"></div>

        <div class="warp-tunnel" id="warpTunnel"></div>

        <div class="core-halo"></div>
        <div class="core-icon" id="coreIcon">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="40%" stop-color="#f0d080"/>
                        <stop offset="100%" stop-color="#c9a227"/>
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <!-- stylised sword -->
                <polygon points="50,5 58,30 54,70 50,85 46,70 42,30" fill="url(#coreGrad)" filter="url(#glow)"/>
                <rect x="38" y="70" width="24" height="5" rx="2" fill="#8a6b4a"/>
                <rect x="46" y="75" width="8" height="18" rx="3" fill="#5a3a1a"/>
                <!-- central number -->
                <text x="50" y="55" font-size="24" font-weight="900" fill="#050308" text-anchor="middle" font-family="Arial, sans-serif" opacity="0.7">7</text>
                <!-- orbiting sparks -->
                <circle cx="50" cy="5" r="3" fill="#fff" opacity="0.9">
                    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
                </circle>
                <circle cx="5" cy="50" r="2" fill="#f0d080" opacity="0.6">
                    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.4s" repeatCount="indefinite"/>
                </circle>
                <circle cx="95" cy="50" r="2" fill="#f0d080" opacity="0.6">
                    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.1s" repeatCount="indefinite"/>
                </circle>
            </svg>
        </div>

        <div class="reload-title" id="reloadTitle">
            <h1>MindStrike</h1>
            <div class="sub">Reloading the Arena</div>
        </div>

        <div class="glitch-layer" id="glitchLayer"></div>
        <div class="big-flash" id="bigFlash"></div>
    </div>

    <!-- ========== MAIN APP ========== -->
    <div id="app">
        <div class="app-card">
            <h2>Welcome Back</h2>
            <div class="sub">The arena awaits.<br>Your rivals are ready.</div>
            <button class="reload-btn" id="replayBtn">⚡ Replay Reload</button>
        </div>
    </div>

    <script>
        // ================================================================
        // INSANE RELOAD ANIMATION
        // ================================================================
        const stage    = document.getElementById('reload-stage');
        const app      = document.getElementById('app');
        const tunnel   = document.getElementById('warpTunnel');
        const coreIcon = document.getElementById('coreIcon');
        const title    = document.getElementById('reloadTitle');
        const glitch   = document.getElementById('glitchLayer');
        const flash    = document.getElementById('bigFlash');
        const replayBtn= document.getElementById('replayBtn');

        // ---- helpers ----
        const rand = (min, max) => Math.random() * (max - min) + min;
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];

        const COLORS = [
            '#f0d080', '#d4a040', '#c9a227', '#ffffff',
            '#c060ff', '#4fd0ff', '#ff6060', '#60ff80'
        ];

        let timers = [];
        function clearTimers() {
            timers.forEach(t => clearTimeout(t));
            timers = [];
        }
        function later(fn, ms) {
            const id = setTimeout(fn, ms);
            timers.push(id);
            return id;
        }

        // ---- warp rings ----
        function spawnWarpRings() {
            tunnel.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                const ring = document.createElement('div');
                ring.className = 'warp-ring';
                const size = 100 + i * 30;
                ring.style.width = size + 'px';
                ring.style.height = size + 'px';
                ring.style.animationDelay = (i * 0.08) + 's';
                ring.style.borderColor = pick(['#f0d080', '#c9a227', '#c060ff', '#4fd0ff']);
                tunnel.appendChild(ring);
            }
        }

        // ---- shockwaves ----
        function spawnShockwaves() {
            for (let i = 0; i < 3; i++) {
                const wave = document.createElement('div');
                wave.className = 'shockwave';
                wave.style.animationDelay = (i * 0.15) + 's';
                wave.style.borderColor = pick(['#f0d080', '#c060ff', '#4fd0ff']);
                wave.style.left = '50%';
                wave.style.top = '50%';
                wave.style.marginLeft = '-100px';
                wave.style.marginTop = '-100px';
                stage.appendChild(wave);
                later(() => wave.remove(), 2000);
            }
        }

        // ---- particle explosion ----
        function spawnParticles(count = 60) {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const angle = Math.random() * Math.PI * 2;
                const dist = rand(80, 500);
                const size = rand(3, 10);
                const color = pick(COLORS);
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = cx + 'px';
                p.style.top = cy + 'px';
                p.style.background = color;
                p.style.boxShadow = `0 0 ${size * 2}px ${color}`;
                p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                p.style.setProperty('--dur', rand(0.8, 1.8) + 's');
                p.style.setProperty('--color', color);
                stage.appendChild(p);
                later(() => p.remove(), 2000);
            }
        }

        // ---- spark streaks ----
        function spawnStreaks(count = 30) {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            for (let i = 0; i < count; i++) {
                const s = document.createElement('div');
                s.className = 'streak';
                const angle = Math.random() * Math.PI * 2;
                const dist = rand(150, 700);
                const color = pick(COLORS);
                s.style.left = cx + 'px';
                s.style.top = cy + 'px';
                s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                s.style.setProperty('--dur', rand(0.5, 1.2) + 's');
                s.style.setProperty('--color', color);
                s.style.background = color;
                s.style.boxShadow = `0 0 12px 4px ${color}`;
                stage.appendChild(s);
                later(() => s.remove(), 1500);
            }
        }

        // ---- glitch trigger ----
        function triggerGlitch() {
            glitch.style.animation = 'none';
            void glitch.offsetWidth;
            glitch.style.animation = '';
        }

        // ---- flash trigger ----
        function triggerFlash() {
            flash.classList.remove('pop');
            void flash.offsetWidth;
            flash.classList.add('pop');
        }

        // ---- the insane reload sequence ----
        function runInsaneReload() {
            // reset everything
            clearTimers();
            stage.classList.remove('gone');
            app.classList.remove('show');
            flash.classList.remove('pop');
            glitch.style.animation = '';
            coreIcon.style.animation = 'none';
            void coreIcon.offsetWidth;
            coreIcon.style.animation = '';

            // clean old elements
            document.querySelectorAll('.shockwave, .particle, .streak').forEach(el => el.remove());

            // 0ms — warp rings begin + glitch flashes
            spawnWarpRings();
            triggerGlitch();

            // 180ms — first shockwave
            later(() => spawnShockwaves(), 180);

            // 300ms — small particle burst
            later(() => spawnParticles(25), 300);

            // 500ms — glitch again + streaks
            later(() => {
                triggerGlitch();
                spawnStreaks(20);
            }, 500);

            // 700ms — big particle explosion
            later(() => {
                spawnParticles(70);
                spawnStreaks(35);
            }, 700);

            // 900ms — shockwave again
            later(() => spawnShockwaves(), 900);

            // 1100ms — glitch + more particles
            later(() => {
                triggerGlitch();
                spawnParticles(40);
            }, 1100);

            // 1400ms — the big flash + hide stage
            later(() => {
                triggerFlash();
                stage.classList.add('gone');
            }, 1400);

            // 1900ms — reveal the app
            later(() => {
                app.classList.add('show');
                // one final mini flash on reveal
                flash.classList.remove('pop');
                void flash.offsetWidth;
                flash.classList.add('pop');
            }, 1900);

            // 2600ms — cleanup
            later(() => {
                flash.classList.remove('pop');
                glitch.style.animation = '';
            }, 2600);
        }

        // ---- skip on click (tap to skip the reload) ----
        stage.addEventListener('click', () => {
            clearTimers();
            stage.classList.add('gone');
            app.classList.add('show');
        });

        // ---- initial run ----
        runInsaneReload();

        // ---- replay button ----
        replayBtn.addEventListener('click', () => {
            app.classList.remove('show');
            later(() => runInsaneReload(), 300);
        });

        // ---- detect refresh for an extra "reload" kicker ----
        const navEntries = performance.getEntriesByType('navigation');
        const isReload = navEntries.length && navEntries[0].type === 'reload';
        if (isReload) {
            // extra glitch pop on reload
            later(() => {
                const kicker = document.createElement('div');
                kicker.textContent = '⟳ RELOAD DETECTED';
                kicker.style.cssText = `
                    position: fixed; bottom: 8%; left: 50%; transform: translateX(-50%);
                    z-index: 50; color: #c060ff; font-size: 0.7rem; letter-spacing: 0.4em;
                    text-transform: uppercase; font-weight: 700; pointer-events: none;
                    text-shadow: 0 0 20px #c060ff; opacity: 0;
                    animation: kickerPop 1.8s ease forwards;
                `;
                const style = document.createElement('style');
                style.textContent = `@keyframes kickerPop {
                    0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
                    20% { opacity: 1; transform: translateX(-50%) translateY(0); }
                    80% { opacity: 1; }
                    100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
                }`;
                document.head.appendChild(style);
                stage.appendChild(kicker);
                later(() => kicker.remove(), 2000);
            }, 800);
        }

        // ---- prevent scroll bounce on mobile ----
        document.body.addEventListener('touchmove', e => {
            if (stage && !stage.classList.contains('gone')) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
