<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MindStrike: Number Wars</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a0d0b">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--gold:#e6a633;--sand:#d9c6a3;--red:#8e1b16;--ink:#140a08}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--sand);font-family:Georgia,'Times New Roman',serif}
#app{max-width:520px;height:100%;margin:auto;position:relative;background:#000;overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;overflow-y:auto;padding:calc(54px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#0009,#000c),var(--bg) center/cover}
.scr.on{display:flex}
h1,h2{color:var(--gold);letter-spacing:.12em;text-align:center;margin:0}h2{font-size:1.15rem}
button{font:inherit;font-weight:bold;letter-spacing:.08em;color:var(--sand);background:linear-gradient(#5a1612,#2b0a08);border:2px solid var(--gold);border-radius:8px;padding:12px 18px;min-width:230px;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(1.4)}button:disabled{opacity:.35}
button.sel{border-color:#fff;background:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.row button{min-width:0;padding:10px 12px;font-size:.8rem}
.ic{width:1.35em;height:1.35em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
.ib{min-width:0;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.bar{position:absolute;top:calc(6px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;z-index:4;pointer-events:none}.bar>*{pointer-events:auto}.bar .r{display:flex;gap:8px}
img.logo{width:min(80%,340px)}
#hud{display:flex;justify-content:space-between;align-items:stretch;gap:6px;width:100%}
#hud .pl,#mid{background:#000a;border:1px solid var(--gold);border-radius:8px;padding:5px 8px;text-align:center;flex:1;font-size:.9rem;min-width:0}
#hud .pl b{font-size:1.4rem;display:block}#hud .pl small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .pl.act{border-color:#fff;box-shadow:0 0 10px var(--gold)}
#mid{flex:1.1}#mid small{display:block}#clock{font-weight:bold;font-size:1.1rem;display:block}#clock.low{color:#ff5a4a}
#banner{color:var(--gold);font-weight:bold;min-height:1.3em;text-align:center;letter-spacing:.1em}
#msg{min-height:2.8em;text-align:center;font-size:1rem}
#range{font-size:1.5rem;color:var(--gold);font-weight:bold}
#pips{display:flex;gap:6px;min-height:14px}#pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold);background:var(--gold)}#pips i.u{background:transparent;opacity:.4}
#num{font:inherit;font-size:2.2rem;width:150px;text-align:center;background:#000b;color:var(--sand);border:2px solid var(--gold);border-radius:8px;padding:4px}
#hist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:1.8em}
#hist span{background:#000b;border:1px solid var(--sand);border-radius:6px;padding:2px 8px;font-size:.85rem}
#shield{width:80%;height:10px;background:#000a;border:1px solid var(--gold);border-radius:6px;overflow:hidden;display:none}#shield i{display:block;height:100%;background:#4a7fb0}
#info{font-size:.82rem;text-align:center;color:var(--gold)}
.pw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.pw button{min-width:0;padding:7px 4px;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;letter-spacing:.04em}
.pw button i{position:absolute;top:2px;right:5px;font-style:normal;font-size:.7rem;color:var(--gold)}
.big{font-size:2.6rem;color:var(--gold);font-weight:bold}
.pop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000d;z-index:9;flex-direction:column;gap:12px;text-align:center}
.pop.on{display:flex}.pop img{max-width:70%;max-height:50%}
.card{background:#140a08;border:2px solid var(--gold);border-radius:10px;margin:16px;padding:16px;max-height:88%;overflow:auto;font-size:.92rem;text-align:left}
.card h2{margin:8px 0}.card p{margin:4px 0}
input[type=text]{font:inherit;font-size:1.3rem;text-align:center;background:#000b;color:var(--sand);border:2px solid var(--gold);border-radius:8px;padding:8px;width:240px;text-transform:uppercase}
label.sl{display:flex;flex-direction:column;gap:4px;width:min(300px,90%);font-size:.9rem}input[type=range]{width:100%;accent-color:var(--gold)}
</style></head><body><div id="app">

<section class="scr on" id="s-home" style="--bg:url(img/menu_bg.webp)">
 <div class="bar"><span></span><div class="r"><button class="ib" data-go="s-set" aria-label="Settings" data-ic="gear"></button></div></div>
 <img class="logo" src="img/logo.webp" alt="MindStrike Number Wars">
 <button id="play">ENTER THE ARENA</button><button data-go="s-set">SETTINGS</button><button id="how">HOW TO PLAY</button>
 <div id="lb" style="font-size:.85rem;text-align:center"></div>
</section>

<section class="scr" id="s-mode" style="--bg:url(img/menu_bg.webp)">
 <div class="bar"><button class="ib bk" aria-label="Back" data-ic="back"></button><span></span></div>
 <h2>CHOOSE YOUR OPPONENT</h2>
 <button data-mode="AI">VS IMPERATOR KIRAXO</button><button data-mode="PVP">PASS &amp; PLAY · 2 PLAYERS</button>
</section>

<section class="scr" id="s-name" style="--bg:url(img/menu_bg.webp)">
 <div class="bar"><button class="ib bk" aria-label="Back" data-ic="back"></button><span></span></div>
 <h2>NAME YOUR WARRIOR</h2>
 <input type="text" id="n1" maxlength="12" placeholder="PLAYER 1" autocomplete="off">
 <input type="text" id="n2" maxlength="12" placeholder="PLAYER 2" autocomplete="off">
 <button id="nameOk">CONTINUE</button>
</section>

<section class="scr" id="s-diff" style="--bg:url(img/menu_bg.webp)">
 <div class="bar"><button class="ib bk" aria-label="Back" data-ic="back"></button><span></span></div>
 <h2>CHOOSE YOUR RANK</h2>
 <div class="row"><button data-d="Easy">LEGIONARY · 1–10</button><button data-d="Medium">CENTURION · 1–25</button><button data-d="Hard">IMPERATOR · 1–100</button></div>
 <div id="styleBox" style="display:contents"><h2>KIRAXO'S STYLE</h2>
 <div class="row"><button data-k="Calculator">STRATEGIST</button><button data-k="Gambler">MERCENARY</button><button data-k="Psycho">BERSERKER</button><button data-k="Prime">PRIME</button></div></div>
 <h2>CHOOSE YOUR BATTLE</h2><div class="row" id="matches"></div>
</section>

<section class="scr" id="s-game" style="--bg:url(img/game_bg.webp)">
 <div class="bar"><button class="ib bk" aria-label="Back / pause" data-ic="back"></button><div class="r"><button class="ib" id="pauseBtn" aria-label="Pause" data-ic="pause"></button><button class="ib" id="gearBtn" aria-label="Settings" data-ic="gear"></button></div></div>
 <div id="hud"><div class="pl" id="h0"><small id="n0"></small><b id="s0">0</b></div>
  <div id="mid"><span id="lvl"></span><small id="tgt"></small><span id="clock"></span></div>
  <div class="pl" id="h1"><small id="n1h"></small><b id="s1">0</b></div></div>
 <div id="shield"><i></i></div><div id="banner"></div><div id="range"></div><div id="pips"></div><div id="hist"></div><div id="msg"></div>
 <input id="num" type="number" inputmode="numeric" placeholder="?"><div id="info"></div>
 <button id="strike" style="min-width:150px"></button>
 <div class="pw" id="pows"></div>
 <div class="row" id="intel" style="display:none"><button data-i="DIRECTION">BATTLE SENSE · <i></i></button><button data-i="RANGE">BATTLE RANGE · <i></i></button><button data-i="ODDEVEN">THE OMEN · <i></i></button><button data-i="DIGIT">LAST MARK · <i></i></button><button data-i="PROPERTY">SECRET TRAIT · <i></i></button></div>
</section>

<section class="scr" id="s-set" style="--bg:url(img/menu_bg.webp)">
 <div class="bar"><button class="ib bk" aria-label="Back" data-ic="back"></button><span></span></div>
 <h2>SETTINGS</h2>
 <label class="sl">Music volume<input type="range" id="vm" min="0" max="1" step=".05"></label>
 <label class="sl">Effects volume<input type="range" id="vs" min="0" max="1" step=".05"></label>
 <div class="row"><button id="tMute"></button><button id="tTimer"></button></div>
 <button id="clrLb">CLEAR HALL OF GLORY</button>
</section>

<section class="scr" id="s-end" style="--bg:url(img/menu_bg.webp)">
 <div class="big" id="endt"></div><div id="ends" style="text-align:center;line-height:1.5"></div>
 <button id="again">FIGHT AGAIN</button><button id="home">MAIN MENU</button>
</section>

<div class="pop" id="pause"><h2>PAUSED</h2><button id="resume">RESUME</button><button id="pSet">SETTINGS</button><button id="pHow">HOW TO PLAY</button><button id="quit">QUIT TO MENU</button></div>
<div class="pop" id="pass" style="z-index:10"><h2>PASS THE DEVICE</h2><div class="big" id="passname"></div><div id="passsp"></div><button id="ready">I AM READY</button></div>
<div class="pop" id="pop" style="pointer-events:none"><img id="popimg" alt=""></div>
<div class="pop" id="help"><div class="card" id="helpBody"></div></div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
window.addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#900;color:#fff;font:12px monospace;padding:6px;z-index:99';d.textContent='Error: '+e.message;document.body.appendChild(d)});
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=Object.assign({music:.35,sfx:.8,mute:false,timer:true,n1:'',n2:''},LS.get('ms_set',{}));const save=()=>LS.set('ms_set',S);
// ---- icons (inline SVG, no emoji) ----
const P={back:'<path d="M15 5l-7 7 7 7"/>',pause:'<path d="M8 5v14M16 5v14" style="stroke-width:3"/>',gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
 SCAN:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',FOCUS:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
 RISK:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/><circle cx="15" cy="15" r="1"/>',SHIELD:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 STEAL:'<circle cx="12" cy="12" r="8"/><path d="M12 7v10M9.5 9.5h4a1.8 1.8 0 010 3.6h-3a1.8 1.8 0 000 3.6H15"/>',JAM:'<path d="M2 12h3l2-6 4 12 3-9 2 3h6"/>',
 INTEL:'<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M9 9h6M9 13h6"/>',DESP:'<path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
$$('[data-ic]').forEach(b=>b.innerHTML=ic(b.dataset.ic));
const POWS=[['SCAN','SCAN'],['FOCUS','FOCUS'],['RISK','RISK'],['SHIELD','SHIELD'],['STEAL','STEAL'],['JAM','JAM'],['INTEL','INTEL'],['DESP','DESPERATE']];
$('#pows').innerHTML=POWS.map(([k,l])=>`<button data-p="${k}">${ic(k)}<span>${l}</span><i></i></button>`).join('');
// ---- tuning (from main.py) ----
const DIFF={Easy:{lo:1,hi:10,att:3,mult:1,acc:.45,hint:'strong',boss:[1,50],layers:2,name:'LEGIONARY'},
 Medium:{lo:1,hi:25,att:4,mult:1.5,acc:.60,hint:'normal',boss:[1,100],layers:3,name:'CENTURION'},
 Hard:{lo:1,hi:100,att:5,mult:2,acc:.75,hint:'weak',boss:[1,200],layers:4,name:'IMPERATOR'}};
const MATCH={Quick:{t:30,time:20,label:'SKIRMISH'},Standard:{t:60,time:30,label:'CAMPAIGN'},War:{t:100,time:30,label:'CONQUEST'},
 Endless:{t:9999,rounds:10,time:25,label:'ETERNAL · 10 ROUNDS'},Sudden:{t:9999,wins:3,time:25,label:'LAST STAND · 3 WINS'}};
const SPECIAL={DOUBLE:['GOLDEN SPOILS',3,'double'],ONE_SHOT:['GLADIUS TRIAL',2,'oneshot'],HOT_ZONE:['KILLING GROUND',3,'hotzone'],
 KIRAXO_RAGE:["IMPERATOR'S WRATH",2,'rage'],BULLSEYE:['BULLSEYE',2,'bullseye'],SHIELD:['SHIELD',2,'shield']};
const PTS={1:15,2:10,3:6},RAGE_ACC=.88,CHIP={blazing:35,hot:15},ARMOR=100,SHRINK=.55,MINW=8,DESP_T=15;
const LEVELS=['I · RECRUIT','II · LEGIONARY','III · CENTURION','IV · LEGATUS','V · IMPERATOR KIRAXO'];
const PERS={Calculator:{mod:.15,risky:0,adapt:0},Gambler:{mod:-.10,risky:1,adapt:0},Psycho:{mod:.05,risky:0,adapt:1},Prime:{mod:.10,risky:0,adapt:1}};
const AI_WIN=['Too easy, Roman.','The gods favour me today.','Numbers obey me.'],AI_LOSE=['Lucky. Next time.','Hmph. The dice are cold.','You live another round.'];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)];
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
// ---- audio ----
const A={};['ding','buzz','fanfare','click','powerup'].forEach(n=>A[n]=new Audio(`audio/${n}.wav`));
const M={};['theme','boss','pvp'].forEach(n=>{M[n]=new Audio(`audio/${n}.mp3`);M[n].loop=true});let curM=null;
const applyVol=()=>{Object.values(M).forEach(m=>m.volume=S.music);Object.values(A).forEach(a=>a.volume=S.sfx)};
const sfx=n=>{if(S.mute||!A[n])return;try{A[n].currentTime=0;A[n].play().catch(()=>{})}catch(e){}};
const play=n=>{const m=M[n]||null;if(curM&&curM!==m)curM.pause();curM=m;if(curM&&!S.mute)curM.play().catch(()=>{})};
applyVol();
// ---- navigation ----
let G=null,stack=['s-home'];
function show(id){$$('.scr').forEach(s=>s.classList.toggle('on',s.id===id));$('#pause').classList.toggle('on',id==='s-game'&&!!G&&G.paused&&!G.done)}
function go(id){stack.push(id);show(id)}
function home(){stack=['s-home'];if(G)G.done=true;G=null;play('theme');lbShow();show('s-home')}
function back(){const c=stack[stack.length-1];
 if(c==='s-game'){if(G&&!G.done)openPause();else home();return}
 if(c==='s-end'){home();return}
 if(stack.length>1){stack.pop();show(stack[stack.length-1])}}
history.pushState(null,'');addEventListener('popstate',()=>{if(stack.length>1){history.pushState(null,'');back()}});
$$('.bk').forEach(b=>b.onclick=back);$$('[data-go]').forEach(b=>b.onclick=()=>{sfx('click');go(b.dataset.go)});
const openPause=()=>{if(!G||G.done||G.paused)return;G.paused=true;$('#pause').classList.add('on')};
const resume=()=>{if(G)G.paused=false;$('#pause').classList.remove('on')};
$('#pauseBtn').onclick=openPause;$('#resume').onclick=resume;$('#quit').onclick=home;
$('#gearBtn').onclick=()=>{openPause();$('#pause').classList.remove('on');go('s-set')};
$('#pSet').onclick=()=>{$('#pause').classList.remove('on');go('s-set')};
const popup=(img,ms=1300)=>{$('#popimg').src=`img/${img}.webp`;$('#pop').classList.add('on');setTimeout(()=>$('#pop').classList.remove('on'),ms)};
// timers that respect pause and a quit game
function later(fn,ms){const g=G;setTimeout(function w(){if(G!==g||!g||g.done&&!g.finishing)return;if(g.paused)return setTimeout(w,200);fn()},ms)}
// ---- settings ----
function setUI(){$('#vm').value=S.music;$('#vs').value=S.sfx;$('#tMute').innerHTML=(S.mute?'SOUND: OFF':'SOUND: ON');$('#tTimer').textContent='ROUND TIMER: '+(S.timer?'ON':'OFF')}
$('#vm').oninput=e=>{S.music=+e.target.value;applyVol();save()};$('#vs').oninput=e=>{S.sfx=+e.target.value;applyVol();save();sfx('ding')};
$('#tMute').onclick=()=>{S.mute=!S.mute;save();setUI();S.mute?curM&&curM.pause():curM&&curM.play().catch(()=>{})};
$('#tTimer').onclick=()=>{S.timer=!S.timer;save();setUI();if(G){timerReset();render()}};
$('#clrLb').onclick=()=>{LS.set('ms_lb',[]);lbShow()};setUI();
const HELP=`<h2>THE IMPERIUM</h2><p>Reach the target score before your rival to unlock the <b>BOSS PHASE</b>.</p>
<h2>THE ROUND</h2><p>Guess the secret number. <b>Higher/Lower</b> shows direction; <b>blazing → freezing</b> shows how close you are. Fewer attempts = more points; first-try hits are CRITICAL (×2). Chain wins for a COMBO; 5 in a row is UNSTOPPABLE.</p>
<h2>POWERS (3 charges each)</h2><p><b>SCAN</b> reveals the upper/lower half. <b>FOCUS</b> shows exact distance on your next guess. <b>RISK</b> pays 3× but costs 2 attempts (-3 if you lose the round). <b>SHIELD</b> protects your combo. <b>STEAL</b> takes 5 points on a near-miss (within 2). <b>JAM</b> (2-player) hides your rival's temperature hint next turn.</p>
<h2>INTEL</h2><p>Spend SCAN charges: Battle Sense, Battle Range, The Omen, Last Mark, Secret Trait. Each type costs 1, then 2, then 3.</p>
<h2>DESPERATION</h2><p>When you trail by 15 or more, gamble once per match: win the round for +25, lose it for -10.</p>
<h2>TIMER</h2><p>You have limited time per guess; if it runs out the round is forfeited (a SHIELD still absorbs it). Turn it off in Settings.</p>
<h2>SPECIAL BATTLES</h2><p>Golden Spoils ×2 · Gladius Trial (1 attempt) · Killing Ground (tight range) · Imperator's Wrath (sharper Kiraxo; Overdrive in 2-player) · Bullseye (within 2 counts) · Shield.</p>
<h2>BOSS PHASE</h2><p>Break Imperator Kiraxo Prime's shield layers by hitting the secret, or wear them down with hot/blazing near-misses. Breaking a layer gives you another swing. The most total damage wins when the last layer falls.</p>
<button onclick="this.closest('.pop').classList.remove('on')" style="width:100%;margin-top:10px">CLOSE</button>`;
$('#helpBody').innerHTML=HELP;const showHelp=()=>$('#help').classList.add('on');$('#how').onclick=showHelp;$('#pHow').onclick=showHelp;
// ---- engine ----
const newRF=()=>({focus:0,risk:0,steal:0,shield:0,scanned:0,riskUsed:0,intelUsed:[],info:[]});
const human=()=>!(G.mode==='AI'&&G.cur===1);
const canAct=()=>G&&!G.done&&!G.busy&&!G.paused&&!G.waiting&&human();
const nm=i=>G.names[i];
function newGame(o){const D=DIFF[o.d],Mt=MATCH[o.m];
 G={mode:o.mode,d:o.d,m:o.m,D,M:Mt,names:o.names,pers:o.pers,score:[0,0],combo:[0,0],wins:[0,0],round:1,cur:0,
  pow:[0,1].map(()=>({SCAN:3,FOCUS:3,RISK:3,SHIELD:3,STEAL:3,JAM:3})),intelUses:[{},{}],desp:[{used:0,active:0},{used:0,active:0}],jamFor:[0,0],
  st:[{ok:0,best:0,crit:0},{ok:0,best:0,crit:0}],pg:[],boss:false,done:false,busy:false,paused:false,waiting:false,dmg:[0,0],broken:0,tLeft:0};
 play(o.mode==='PVP'?'pvp':'theme');$('#pause').classList.remove('on');startTurn(true)}
function bg(){$('#s-game').style.setProperty('--bg',`url(img/${G.boss?'boss_bg':G.mode==='PVP'?'pvp_bg':'game_bg'}.webp)`)}
function startTurn(first){const D=G.D;G.busy=false;G.rf=newRF();G.att=0;G.guesses=0;G.hist=[];G.jam=G.jamFor[G.cur];G.jamFor[G.cur]=0;
 if(G.boss){G.special='BOSS';const v=G.vit[G.cur];G.maxAtt=G.mode==='PVP'?Math.max(2,v-G.broken):v}
 else{G.special=null;G.lo=D.lo;G.hi=D.hi;G.maxAtt=D.att;
  if(!first&&Math.random()<.22){const keys=Object.keys(SPECIAL);let r=Math.random()*keys.reduce((s,k)=>s+SPECIAL[k][1],0);G.special=keys.find(k=>(r-=SPECIAL[k][1])<0)||keys[0];
   if(G.special==='ONE_SHOT')G.maxAtt=1;
   if(G.special==='KIRAXO_RAGE'&&G.mode==='PVP')G.maxAtt=Math.max(2,G.maxAtt-1);
   if(G.special==='HOT_ZONE'){const span=Math.max(4,Math.floor((D.hi-D.lo)/3)),c=rnd(D.lo,D.hi);let lo=Math.max(D.lo,c-(span>>1)),hi=Math.min(D.hi,lo+span);lo=Math.max(D.lo,hi-span);G.lo=lo;G.hi=hi}
   if(G.mode==='AI')popup(SPECIAL[G.special][2])}
  G.secret=rnd(G.lo,G.hi);G.kLo=G.lo;G.kHi=G.hi}
 if(G.special==='SHIELD')G.rf.shield=1;
 bg();timerReset();
 if(G.mode==='PVP'&&!first){G.waiting=true;$('#passname').textContent=nm(G.cur);$('#passsp').textContent=G.special&&G.special!=='BOSS'?(G.special==='KIRAXO_RAGE'?'OVERDRIVE':SPECIAL[G.special][0]):'';$('#pass').classList.add('on')}
 render(G.mode==='AI'&&G.cur===1?'':`${nm(G.cur)}, strike! Guess ${G.kLo}–${G.kHi}.`);
 if(G.mode==='AI'&&G.cur===1)later(aiPlay,700)}
$('#ready').onclick=()=>{G.waiting=false;$('#pass').classList.remove('on');timerReset();render()};
function nextTurn(){G.cur=1-G.cur;if(G.cur===0)G.round++;
 if(!G.boss&&G.m==='Endless'&&G.round>G.M.rounds)return finish(G.score[0]===G.score[1]?-1:G.score[0]>G.score[1]?0:1);
 startTurn(false)}
function afterTurn(){if(G.done)return;const t=G.M.t,w=G.cur;
 if(!G.boss){
  if(G.m==='Sudden'&&(G.wins[0]>=G.M.wins||G.wins[1]>=G.M.wins))return finish(G.wins[0]>G.wins[1]?0:1);
  if(t<9999){
   if(G.mode==='AI'){if(G.score[1]>=t)return finish(1);if(G.score[0]>=t)return enterBoss(0)}
   else if(G.score[0]>=t||G.score[1]>=t)return enterBoss(G.score[w]>=t?w:1-w)}}
 nextTurn()}
// scoring
function award(who,tries,risky){let pts=Math.round((PTS[tries]||3)*G.D.mult)*(risky?3:1),crit=tries===1;if(crit)pts*=2;
 const c=++G.combo[who];G.st[who].best=Math.max(G.st[who].best,c);G.st[who].ok++;if(crit)G.st[who].crit++;
 if(c>=2)pts+=4*(c-1);if(c===5)pts+=15;if(G.special==='DOUBLE')pts*=2;if(Math.random()<.05)pts+=10;
 G.score[who]+=pts;G.wins[who]++;return{pts,crit,c}}
function temp(g){const span=Math.max(1,G.hi-G.lo),c=1-Math.abs(g-G.secret)/span;
 const t=c>.85?'blazing':c>.6?'hot':c>.35?'warm':c>.15?'cold':'freezing';
 const L={blazing:'blazing hot!',hot:'hot',warm:'warm',cold:'cold',freezing:'freezing'};
 return[t,G.D.hint==='weak'?(c>.35?'warmer…':'colder…'):L[t],c]}
// ---- timer ----
const limit=()=>G.M.time;
function timerReset(){G.tLeft=S.timer?limit():0}
setInterval(()=>{if(!G||G.done||G.busy||G.paused||G.waiting||!human()||!S.timer||!$('#s-game').classList.contains('on'))return;
 G.tLeft-=.25;clockUI();if(G.tLeft<=0)failTurn(true)},250);
function clockUI(){const c=$('#clock');c.textContent=S.timer&&G?Math.max(0,Math.ceil(G.tLeft))+'s':'';c.classList.toggle('low',S.timer&&G&&G.tLeft<=5)}
// ---- player actions ----
function strike(){if(!canAct())return;const el=$('#num'),g=parseInt(el.value,10),w=G.cur,rf=G.rf;
 if(isNaN(g)||g<G.lo||g>G.hi){$('#msg').textContent=`Enter a number from ${G.lo} to ${G.hi}.`;sfx('buzz');return}
 const risky=!!rf.risk;if(risky&&G.att+2>G.maxAtt){$('#msg').textContent='Not enough attempts left for RISK.';sfx('buzz');return}
 el.value='';sfx('click');G.att+=risky?2:1;G.guesses++;if(w===0)G.pg.push(g);if(risky){rf.riskUsed=1;rf.risk=0}
 const exact=g===G.secret,bull=!exact&&G.special==='BULLSEYE'&&Math.abs(g-G.secret)<=2;let[tier,text,c]=temp(g);
 if(rf.focus){rf.focus=0;text=`EXACT FOCUS: ${Math.round(c*100)}% close — ${tier.toUpperCase()}!`}
 let stole=0;if(!exact&&rf.steal&&Math.abs(g-G.secret)<=2){stole=Math.min(5,G.score[1-w]);G.score[w]+=stole;G.score[1-w]-=stole;rf.steal=0}
 G.hist.push(g);let broke=false;
 if(G.boss&&!exact&&!bull&&CHIP[tier]){G.armor-=CHIP[tier];G.dmg[w]+=CHIP[tier];broke=G.armor<=0}
 if(exact||bull||broke){let r={pts:0,c:0},dm='';
  if(exact||bull){r=award(w,G.guesses,risky);if(bull){G.score[w]+=12;r.pts+=12}
   if(G.desp[w].active){G.desp[w].active=0;G.score[w]+=25;r.pts+=25;dm=' · DESPERATION +25'}}
  sfx('ding');if(G.boss){if(exact||bull)G.dmg[w]+=100;return layerHit(w)}
  return turnDone(`${bull?'BULLSEYE! ':'Correct! '}+${r.pts} pts${risky?' · RISKY ×3':''}${r.crit?' · CRITICAL!':''}${r.c>=2?` · COMBO ×${r.c}`:''}${r.c===5?' · UNSTOPPABLE!':''}${stole?` · STOLE ${stole}`:''}${dm}`)}
 if(G.att>=G.maxAtt)return failTurn(false);
 const dir=g<G.secret?'Higher':'Lower';g<G.secret?G.kLo=Math.max(G.kLo,g+1):G.kHi=Math.min(G.kHi,g-1);
 if(G.jam)text='[JAMMED — no hint!]';timerReset();
 render(`${dir} — ${text}${stole?` · STOLE ${stole} pts!`:''}`)}
function turnDone(msg){G.busy=true;render(msg);later(afterTurn,1500)}
function failTurn(timeout){const w=G.cur,rf=G.rf,rev=G.boss?'':` It was ${G.secret}.`;let msg,pen='';G.busy=true;
 if(rf.riskUsed&&!timeout){G.score[w]=Math.max(0,G.score[w]-3);pen=' (-3 RISK PENALTY)'}
 if(rf.shield){rf.shield=0;msg=`${timeout?"Time's up — but your ":'Your '}SHIELD absorbed the loss!${rev}${pen}`}
 else{let dp='';if(G.desp[w].active){G.desp[w].active=0;G.score[w]=Math.max(0,G.score[w]-10);dp=' (-10 DESPERATION)'}
  G.combo[w]=0;sfx('buzz');if(G.mode==='AI'&&w===0)popup('taunt',1200);
  msg=(timeout?`TIME'S UP! Round forfeited.${rev}`:`Out of attempts!${rev}`)+pen+dp}
 render(msg);later(afterTurn,1500)}
function usePow(n){if(!canAct())return;const w=G.cur,rf=G.rf;
 if(n==='INTEL'){const i=$('#intel');i.style.display=i.style.display==='none'?'flex':'none';return}
 if(n==='DESP'){if(!despOK())return;G.desp[w]={used:1,active:1};sfx('powerup');return render('DESPERATION — win this round for +25, lose it for -10!')}
 if(G.pow[w][n]<=0)return;const act={SCAN:rf.scanned,SHIELD:rf.shield,FOCUS:rf.focus,RISK:rf.risk,STEAL:rf.steal,JAM:0}[n];if(act)return;
 G.pow[w][n]--;sfx('powerup');let m='';
 if(n==='SCAN'){rf.scanned=1;const mid=(G.kLo+G.kHi)>>1,up=G.secret>mid;up?G.kLo=Math.max(G.kLo,mid+1):G.kHi=Math.min(G.kHi,mid);m=`SCAN: the secret lies in the ${up?'UPPER':'LOWER'} half (${G.kLo}–${G.kHi}).`}
 if(n==='FOCUS'){rf.focus=1;m='FOCUS active — your next guess shows the exact distance!'}
 if(n==='RISK'){rf.risk=1;m='RISK active — next guess costs 2 attempts but pays 3×!'}
 if(n==='SHIELD'){rf.shield=1;m='SHIELD raised — your combo is protected this round.'}
 if(n==='STEAL'){rf.steal=1;m='STEAL active — land within 2 numbers to steal 5 points!'}
 if(n==='JAM'){G.jamFor[1-w]=1;m=`JAM set — ${nm(1-w)} gets no temperature hint on their next turn.`}
 render(m)}
const despOK=()=>G&&!G.desp[G.cur].used&&(G.score[1-G.cur]-G.score[G.cur])>=DESP_T;
const intelCost=t=>[1,2,3][Math.min(G.intelUses[G.cur][t]||0,2)];
function useIntel(t){if(!canAct()||G.rf.intelUsed.includes(t))return;const w=G.cur,c=intelCost(t);
 if(G.pow[w].SCAN<c){$('#msg').textContent=`Needs ${c} SCAN charges.`;sfx('buzz');return}
 G.pow[w].SCAN-=c;G.rf.intelUsed.push(t);G.intelUses[w][t]=(G.intelUses[w][t]||0)+1;sfx('powerup');const mid=(G.lo+G.hi)>>1;let r;
 if(t==='DIRECTION')r=`BATTLE SENSE: the secret is ${G.secret>mid?'above':'at or below'} the middle.`;
 if(t==='RANGE'){const q=(G.hi-G.lo)>>2;r=`BATTLE RANGE: between ${Math.max(G.lo,G.secret-q)} and ${Math.min(G.hi,G.secret+q)}.`}
 if(t==='ODDEVEN')r=`THE OMEN: the secret is ${G.secret%2?'ODD':'EVEN'}.`;
 if(t==='DIGIT')r=`LAST MARK: the secret ends in ${G.secret%10}.`;
 if(t==='PROPERTY'){const p=[];if(isPrime(G.secret))p.push('prime');if(G.secret%3===0)p.push('multiple of 3');if(G.secret%5===0)p.push('multiple of 5');p.push(G.secret>mid?'high':'low');r=`SECRET TRAIT: ${pick(p).toUpperCase()}.`}
 G.rf.info.push(r);render(r)}
// ---- boss ----
function enterBoss(trig){const[lo,hi]=G.D.boss,o=1-trig;G.boss=true;G.cur=trig;G.vit=[0,0];G.vit[trig]=4;G.vit[o]=3;
 Object.assign(G,{lo,hi,kLo:lo,kHi:hi,secret:rnd(lo,hi),layers:G.D.layers,total:G.D.layers,armor:ARMOR,broken:0,dmg:[0,0]});
 if(G.mode==='PVP'){G.dmg[o]=40;G.pow[o].SCAN++}
 play(G.mode==='PVP'?'boss':'boss');popup('rage',1500);G.busy=true;bg();render(`${nm(trig)} reached the target — IMPERATOR KIRAXO PRIME takes the field!`);
 later(()=>{G.busy=false;G.round=G.round;startBossFirst()},1600)}
function startBossFirst(){const first=G.cur;G.cur=first;G.rf=newRF();G.att=0;G.guesses=0;G.hist=[];G.jam=0;G.special='BOSS';const v=G.vit[G.cur];G.maxAtt=G.mode==='PVP'?Math.max(2,v-G.broken):v;timerReset();
 render(`${nm(G.cur)}, shatter his shields!`);if(G.mode==='AI'&&G.cur===1)later(aiPlay,700)}
function layerHit(who){G.layers--;G.broken++;
 if(G.layers<=0){const d=G.dmg;return finish(d[0]===d[1]?who:(d[0]>d[1]?0:1))}
 const w=Math.max(MINW,Math.floor((G.hi-G.lo)*SHRINK)),h=w>>1;let lo=Math.max(G.lo,Math.min(G.secret-h,G.hi-w)),hi=Math.min(G.hi,lo+w);lo=Math.max(G.lo,hi-w);
 G.lo=lo;G.hi=hi;G.kLo=lo;G.kHi=hi;G.secret=rnd(lo,hi);G.armor=ARMOR;G.att=0;G.guesses=0;G.hist=[];G.rf=newRF();timerReset();sfx('powerup');
 if(G.mode==='AI'&&who===1){G.busy=true;render(`Kiraxo cracks a shield layer open! ${G.layers}/${G.total} remain.`);later(()=>{G.busy=false;aiPlay()},1500)}
 else render(`SHIELD SHATTERED! ${G.layers}/${G.total} remain — ${nm(who)} keeps swinging!`)}
// ---- Kiraxo AI ----
function aiGuesses(acc,maxT,onGuess,focus){const P=PERS[G.pers];let lo=G.lo,hi=G.hi,g,tries=1;
 if(focus){const mg=Math.max(1,(G.hi-G.lo)/20|0);g=rnd(Math.max(G.lo,G.secret-mg),Math.min(G.hi,G.secret+mg))}else g=rnd(lo,hi);
 let bias=null;if(P.adapt&&G.pg.length){const av=G.pg.reduce((a,b)=>a+b,0)/G.pg.length;bias=av>(G.D.lo+G.D.hi)/2?'h':'l'}
 const bull=x=>G.special==='BULLSEYE'&&x!==G.secret&&Math.abs(x-G.secret)<=2;
 let stop=onGuess(g)||g===G.secret||bull(g);
 while(!stop&&tries<maxT){g<G.secret?lo=Math.max(lo,g+1):hi=Math.min(hi,g-1);
  if(P.risky&&Math.random()<.3)g=rnd(G.lo,G.hi);
  else if(Math.random()<acc&&lo<=hi){const m=(lo+hi)>>1;g=bias==='h'?rnd(m,hi):bias==='l'?rnd(lo,m):rnd(lo,hi)}else g=rnd(G.lo,G.hi);
  tries++;stop=onGuess(g)||g===G.secret||bull(g)}
 return{g,tries,bull:bull(g)}}
function aiPlay(){if(G.done||G.cur!==1)return;G.busy=true;$('#msg').innerHTML='<img src="img/kiraxo.webp" height="80" alt="">';render0();
 later(()=>{G.boss?aiBoss():aiTurn()},1200)}
function aiTurn(){const acc=Math.min(.95,(G.special==='KIRAXO_RAGE'?RAGE_ACC:G.D.acc)+PERS[G.pers].mod),r=aiGuesses(acc,G.maxAtt,()=>false,false);let m;
 if(r.g===G.secret||r.bull){const a=award(1,r.tries,false);if(r.bull){G.score[1]+=12;a.pts+=12}m=`Kiraxo ${r.bull?'landed a BULLSEYE':'guessed it'} in ${r.tries} ${r.tries>1?'tries':'try'}! +${a.pts} pts  “${pick(AI_WIN)}”`;sfx('buzz')}
 else{G.combo[1]=0;m=`Kiraxo couldn't find it (it was ${G.secret}).  “${pick(AI_LOSE)}”`}
 turnDone(m)}
function aiBoss(){const acc=Math.min(.95,G.D.acc+PERS[G.pers].mod+.07*G.broken),useF=G.pow[1].FOCUS>0;if(useF)G.pow[1].FOCUS--;let broke=false;
 const chip=x=>{if(x===G.secret)return false;const c=1-Math.abs(x-G.secret)/Math.max(1,G.hi-G.lo),t=c>.85?'blazing':c>.6?'hot':'';if(CHIP[t]){G.armor-=CHIP[t];G.dmg[1]+=CHIP[t];if(G.armor<=0)broke=true}return broke};
 const r=aiGuesses(acc,G.vit[1],chip,useF),fn=useF?'⚡ Kiraxo activated FOCUS!  ':'';
 if(r.g===G.secret||broke){if(r.g===G.secret)G.dmg[1]+=100;sfx('buzz');G.busy=false;return layerHit(1)}
 G.busy=true;render(fn+'Kiraxo missed the weak point.');later(()=>nextTurn(),1500)}
// ---- render ----
function render(msg){if(!G)return;const b=G.boss;
 $('#n0').textContent=nm(0);$('#n1h').textContent=nm(1);$('#s0').textContent=G.score[0];$('#s1').textContent=G.score[1];
 $('#h0').classList.toggle('act',G.cur===0&&G.mode==='PVP');$('#h1').classList.toggle('act',G.cur===1&&G.mode==='PVP');
 $('#lvl').textContent=b?'BOSS PHASE':`ROUND ${G.round}`;
 $('#tgt').textContent=b?`${G.layers}/${G.total} SHIELDS`:(G.M.t<9999?`TARGET ${G.M.t}`:G.M.label);
 $('#shield').style.display=b?'block':'none';if(b)$('#shield i').style.width=Math.max(0,G.armor)+'%';
 const lv=Math.min(4,Math.floor(Math.max(0,G.score[0])/(G.M.t<9999?G.M.t:200)*4));
 $('#banner').textContent=b?'IMPERATOR KIRAXO PRIME':(G.special?(G.special==='KIRAXO_RAGE'&&G.mode==='PVP'?'OVERDRIVE':SPECIAL[G.special][0]):(G.mode==='PVP'?nm(G.cur):LEVELS[lv]));
 $('#range').textContent=`${G.kLo} — ${G.kHi}`;
 $('#pips').innerHTML=Array.from({length:G.maxAtt},(_,i)=>`<i class="${i<G.att?'u':''}"></i>`).join('');
 $('#hist').innerHTML=G.hist.map(h=>`<span>${h}</span>`).join('');
 if(msg!==undefined)$('#msg').textContent=msg;
 $('#info').innerHTML=G.rf.info.map(x=>`<div>${x}</div>`).join('');
 $('#strike').innerHTML=`${ic('back').replace('<path d="M15 5l-7 7 7 7"/>','<path d="M4 20L20 4M14 4h6v6M4 14l6 6"/>')} STRIKE`;
 render0();clockUI()}
function render0(){if(!G)return;const off=!canAct()||false,w=G.cur,rf=G.rf;$('#strike').disabled=off;
 $$('[data-p]').forEach(b=>{const n=b.dataset.p,i=b.querySelector('i');b.style.display=(n==='JAM'&&G.mode!=='PVP')||(n==='DESP'&&!despOK()&&!G.desp[w].active)?'none':'';
  const act={SCAN:rf.scanned,SHIELD:rf.shield,FOCUS:rf.focus,RISK:rf.risk,STEAL:rf.steal,DESP:G.desp[w].active,JAM:0}[n];
  if(n==='INTEL'){i.textContent='';b.disabled=off;return}if(n==='DESP'){i.textContent='';b.disabled=off||!!act;b.classList.toggle('sel',!!act);return}
  i.textContent=G.pow[w][n];b.disabled=off||G.pow[w][n]<=0||!!act;b.classList.toggle('sel',!!act)});
 $$('[data-i]').forEach(b=>{const t=b.dataset.i,c=intelCost(t);b.querySelector('i').textContent=c;b.disabled=off||rf.intelUsed.includes(t)||G.pow[w].SCAN<c})}
$$('[data-p]').forEach(b=>b.onclick=()=>usePow(b.dataset.p));$$('[data-i]').forEach(b=>b.onclick=()=>useIntel(b.dataset.i));
$('#strike').onclick=strike;$('#num').addEventListener('keydown',e=>{if(e.key==='Enter')strike()});
// ---- end & leaderboard ----
const lbGet=()=>LS.get('ms_lb',[]);
function lbShow(){const l=lbGet();$('#lb').innerHTML=l.length?'<b>HALL OF GLORY</b><br>'+l.map((e,i)=>`${i+1}. ${e.n||'—'} · ${e.s} pts · ${e.d}`).join('<br>'):''}
function finish(w){G.finishing=true;G.done=true;G.busy=true;resume();$('#pass').classList.remove('on');
 const draw=w<0,win=!draw&&(G.mode==='PVP'||w===0);play('theme');sfx(win?'fanfare':'buzz');
 if(!draw&&(G.mode==='PVP'||w===0)){const l=lbGet();l.push({n:nm(w),s:G.score[w],d:G.D.name+' · '+G.M.label});l.sort((a,b)=>b.s-a.s);LS.set('ms_lb',l.slice(0,5))}
 $('#endt').textContent=draw?'DRAW':(G.mode==='PVP'?`${nm(w)} WINS`:win?'VICTORY':'DEFEAT');
 const st=i=>`${nm(i)}: ${G.score[i]} pts · ${G.st[i].ok} correct · best combo ${G.st[i].best} · ${G.st[i].crit} criticals`;
 $('#ends').innerHTML=`${draw?'The arena is split.':G.mode==='PVP'?'Glory to the victor.':win?'Kiraxo bows before the legion.':'Imperator Kiraxo claims the arena.'}<br>${st(0)}<br>${st(1)}<br>${G.D.name} · ${G.M.label}`;
 render0();stack.push('s-end');show('s-end')}
// ---- setup wiring ----
let setup={mode:'AI',d:'Medium',k:'Calculator',lastOpts:null};
$('#matches').innerHTML=Object.entries(MATCH).map(([k,v])=>`<button data-m="${k}">${v.label}</button>`).join('');
const selIn=(attr,val)=>$$(`[${attr}]`).forEach(x=>x.classList.toggle('sel',x.getAttribute(attr)===val));
$('#play').onclick=()=>{play('theme');sfx('click');go('s-mode')};
$$('[data-mode]').forEach(b=>b.onclick=()=>{setup.mode=b.dataset.mode;sfx('click');$('#n2').style.display=setup.mode==='PVP'?'':'none';$('#n1').value=S.n1;$('#n2').value=S.n2;
 $('#n1').placeholder=setup.mode==='PVP'?'PLAYER 1':'YOUR NAME';$('#styleBox').style.display=setup.mode==='PVP'?'none':'contents';go('s-name')});
$('#nameOk').onclick=()=>{S.n1=$('#n1').value.trim().toUpperCase();S.n2=$('#n2').value.trim().toUpperCase();save();sfx('click');go('s-diff')};
$$('[data-d]').forEach(b=>b.onclick=()=>{setup.d=b.dataset.d;selIn('data-d',setup.d);sfx('click')});
$$('[data-k]').forEach(b=>b.onclick=()=>{setup.k=b.dataset.k;selIn('data-k',setup.k);sfx('click')});
selIn('data-d','Medium');selIn('data-k','Calculator');
function launch(){const o=setup.lastOpts;newGame(o);stack=stack.filter(x=>x!=='s-end'&&x!=='s-game');go('s-game')}
$$('[data-m]').forEach(b=>b.onclick=()=>{sfx('click');const pvp=setup.mode==='PVP';
 setup.lastOpts={mode:setup.mode,d:setup.d,m:b.dataset.m,pers:setup.k,names:[S.n1||(pvp?'PLAYER 1':'LEGIONARY'),pvp?(S.n2||'PLAYER 2'):'KIRAXO']};launch()});
$('#again').onclick=launch;$('#home').onclick=home;
lbShow();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
